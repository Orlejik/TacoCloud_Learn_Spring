<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>
</head>
<body>

<div>
    <p th:text="${currentUserGetFullName}"></p> <p>, your orders:  </p>
</div>

<div th:each="order : ${myOrders}">
    <h2>Order placed at: <span th:text="${order.placedAt}"></span></h2>
    <p th:text="'Deliver to: ' + ${order.deliveryName} + ', ' + ${order.deliveryStreet} + ', ' + ${order.deliveryCity} + ', ' + ${order.deliveryState} + ' ' + ${order.deliveryZip}"></p>
    <ul>
        <li th:each="taco : ${order.tacos}" th:text="${taco.name}"></li>
    </ul>
    <hr/>
</div>

</body>
</html>
